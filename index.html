<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LIFT" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LIFT</title>
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <style>
:root {
  color-scheme: dark;
  --bg: #050505;
  --panel: #101010;
  --panel-2: #171717;
  --panel-3: #0b0b0b;
  --text: #f5f5f0;
  --muted: #969690;
  --quiet: #666661;
  --line: #2a2a27;
  --line-soft: #20201d;
  --good: #d8ff7a;
  --warn: #f5cc66;
  --bad: #ff8f80;
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); overscroll-behavior-y: none; }
button, input, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
input, textarea { -webkit-tap-highlight-color: transparent; }

.app {
  min-height: 100dvh;
  padding: calc(14px + var(--safe-top)) 14px calc(24px + var(--safe-bottom));
  background:
    radial-gradient(circle at 50% -12%, rgba(255,255,255,.13), transparent 34%),
    linear-gradient(180deg, #070707 0%, #050505 100%);
}
.topbar {
  height: 44px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin: 0 auto 12px;
  max-width: 760px;
}
.logo {
  justify-self: start;
  border: 0;
  background: transparent;
  color: var(--text);
  font-weight: 950;
  letter-spacing: -0.08em;
  font-size: 28px;
  padding: 0;
}
.version {
  color: var(--quiet);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.top-action {
  justify-self: end;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #0d0d0d;
  color: var(--text);
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: .04em;
}
.main { max-width: 760px; margin: 0 auto; }
.hero {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: linear-gradient(180deg, #171717 0%, #0d0d0d 100%);
  padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.38);
}
.kicker {
  color: var(--quiet);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .16em;
  text-transform: uppercase;
  margin: 0 0 4px;
}
.title {
  font-size: clamp(42px, 12vw, 84px);
  line-height: .82;
  font-weight: 950;
  letter-spacing: -0.085em;
  text-transform: uppercase;
  margin: 0;
}
.meta { color: var(--muted); font-size: 14px; line-height: 1.35; margin: 12px 0 0; }
.note { color: #c8c8c1; font-size: 15px; line-height: 1.35; margin: 10px 0 0; }

.icon-plain {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--quiet);
  padding: 0;
  margin: 0;
  cursor: pointer;
}
.icon-plain:focus-visible { outline: 2px solid var(--line-strong); outline-offset: 4px; border-radius: 6px; }
.note-pen {
  position: absolute;
  top: 18px;
  right: 18px;
  font-size: 18px;
  line-height: 1;
  font-weight: 700;
}
.note-pen:hover { color: var(--text); }
.note-editor {
  width: 100%;
  min-height: 86px;
  margin: 10px 0 0;
  border: 0;
  background: transparent;
  color: #c8c8c1;
  font: inherit;
  font-size: 15px;
  line-height: 1.35;
  resize: vertical;
  padding: 0;
  outline: none;
}
.note-editor::placeholder { color: #8f8f85; }


.session-date {
  margin: 10px 0 0;
  color: var(--text);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -.04em;
  text-transform: uppercase;
}
.week-wrap { margin-top: 14px; }
.week-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--quiet);
  font-size: 10px;
  font-weight: 950;
  letter-spacing: .14em;
  text-transform: uppercase;
  padding: 0 4px 8px;
}
.week-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
}
.week-tab {
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #0b0b0b;
  color: var(--text);
  font-size: 17px;
  font-weight: 950;
  letter-spacing: -.04em;
  display: grid;
  place-items: center;
  gap: 2px;
}
.week-tab span {
  min-height: 10px;
  color: var(--quiet);
  font-size: 8px;
  font-weight: 950;
  letter-spacing: .12em;
}
.week-tab.active { background: var(--text); color: #050505; border-color: var(--text); }
.week-tab.active span { color: #050505; }
.week-tab.deload-tab:not(.active) { border-style: dashed; }
.week-session-list { display: grid; gap: 8px; margin-top: 12px; }
.session-row-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  color: var(--text);
  padding: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  text-align: left;
}
.session-row-card.past { opacity: .62; }
.session-row-card.today { border-color: var(--text); }
.session-row-card.rest { border-style: dashed; }
.session-row-date { color: var(--muted); font-size: 12px; font-weight: 850; }
.session-row-title { margin-top: 2px; font-size: 18px; line-height: .95; font-weight: 950; letter-spacing: -.055em; text-transform: uppercase; }
.session-row-side { display: grid; justify-items: end; gap: 3px; color: var(--quiet); font-size: 10px; font-weight: 950; letter-spacing: .1em; text-transform: uppercase; }
.session-row-side small { color: var(--muted); font-size: 11px; letter-spacing: 0; text-transform: none; }
.month-grid.compact { grid-template-columns: repeat(4, minmax(0,1fr)); }
.month-grid.compact .stat { padding: 13px; border-radius: 18px; }
.month-grid.compact .stat-value { font-size: 30px; }
.compact-actions { grid-template-columns: 1fr 1fr; }
.compact-actions .action.primary { grid-column: 1 / -1; }

.progress-track {
  margin: 18px 0 12px;
  height: 8px;
  border-radius: 999px;
  background: #252522;
  overflow: hidden;
}
.progress-fill { height: 100%; border-radius: inherit; background: var(--text); transition: width .25s ease; }
.hero-bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 13px; }

.read-only-hero .note-pen { display: none; }
.readonly-pill {
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 11px;
  font-size: 10px;
  font-weight: 950;
  letter-spacing: .12em;
  text-transform: uppercase;
  white-space: nowrap;
}
.read-only-stack .replay-card {
  opacity: 1;
}

.toggle-wrap { display: inline-flex; align-items: center; gap: 8px; }
.toggle {
  width: 44px; height: 26px; border-radius: 999px; background: #2a2a28;
  position: relative; border: 1px solid var(--line); appearance: none; outline: none;
}
.toggle:checked { background: #f5f5f0; }
.toggle::after {
  content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: transform .2s ease;
}
.toggle:checked::after { background: #050505; transform: translateX(18px); }
.session-strip { display: flex; overflow-x: auto; gap: 8px; padding: 14px 0 2px; scrollbar-width: none; }
.session-strip::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: #0b0b0b;
  padding: 10px 13px;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: -.02em;
}
.chip.active { background: var(--text); color: #050505; border-color: var(--text); }

.rest-hero { background: linear-gradient(180deg, #131313 0%, #090909 100%); }
.week-strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(104px, 1fr);
  overflow-x: auto;
  gap: 8px;
  padding: 14px 0 2px;
  scrollbar-width: none;
}
.week-strip::-webkit-scrollbar { display: none; }
.day-chip {
  min-height: 76px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: #0b0b0b;
  color: var(--muted);
  padding: 10px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  align-content: stretch;
  text-align: left;
}
.day-name {
  color: var(--quiet);
  font-size: 10px;
  font-weight: 950;
  letter-spacing: .16em;
}
.day-title {
  color: var(--text);
  font-size: 13px;
  font-weight: 920;
  letter-spacing: -.04em;
  text-transform: uppercase;
  line-height: 1.02;
  align-self: center;
}
.day-state {
  color: var(--quiet);
  font-size: 9px;
  font-weight: 950;
  letter-spacing: .12em;
  text-transform: uppercase;
  align-self: end;
}
.day-chip.past { opacity: .54; }
.day-chip.future { background: #080808; }
.day-chip.today { border-color: var(--text); }
.day-chip.active {
  background: var(--text);
  color: #050505;
  border-color: var(--text);
}
.day-chip.active .day-name,
.day-chip.active .day-title,
.day-chip.active .day-state { color: #050505; }
.day-state.placeholder { visibility: hidden; }
.day-chip.rest { border-style: dashed; }
.day-chip.rest .day-title { color: var(--text); }
.day-chip.rest.active .day-title { color: #050505; }
.stack { display: grid; gap: 12px; margin-top: 14px; }
.card {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--panel);
  overflow: hidden;
}
.card.done { opacity: .62; }
.card-head { padding: 16px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.card-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.exercise-title { font-size: 24px; line-height: .94; font-weight: 920; letter-spacing: -.055em; text-transform: uppercase; margin: 0; }
.family { color: var(--quiet); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; font-weight: 850; margin: 0; }
.badge { border: 1px solid var(--line); border-radius: 999px; color: var(--muted); padding: 6px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.target { color: var(--muted); font-size: 13px; }
.tiny-note { color: #b8b8b2; font-size: 12px; line-height: 1.35; }
.rows { display: grid; gap: 8px; padding: 12px; }
.row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  border-radius: var(--radius-md);
  background: var(--panel-2);
  padding: 10px;
}
.row.buildup {
  background: repeating-linear-gradient(-45deg, #111 0 8px, #151515 8px 16px);
  border: 1px dashed #383833;
}
.row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-label { color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
.row.buildup .row-label { color: var(--quiet); }
.live-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 12px;
}
.inline-load {
  min-width: 0;
  display: inline-flex;
  justify-content: flex-start;
  align-items: baseline;
  gap: 4px;
  color: var(--text);
  font-size: 17px;
  font-weight: 930;
  letter-spacing: -.045em;
  justify-self: start;
}
.inline-load input {
  width: auto;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  padding: 0;
  margin: 0;
  font: inherit;
  line-height: 1;
  text-align: left;
}
.inline-weight { max-width: 4.6ch; }
.inline-reps { max-width: 3.3ch; }
.inline-unit {
  color: var(--text);
  font: inherit;
  line-height: 1;
  white-space: nowrap;
}
.swipe-row {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-md);
  touch-action: pan-y;
}
.swipe-row.dragging { touch-action: none; }
.swipe-track {
  position: relative;
  z-index: 2;
  transition: transform .18s ease;
  will-change: transform;
}
.swipe-row.dragging .swipe-track { transition: none; }
.swipe-delete {
  position: absolute;
  inset: 0 0 0 auto;
  z-index: 1;
  width: 88px;
  border: 0;
  border-radius: var(--radius-md);
  background: #3a0d0a;
  color: #ffb6aa;
  font-size: 11px;
  font-weight: 950;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.row-hint {
  color: var(--quiet);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.swipe-row.open .row-hint { color: var(--bad); }
.row-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.input-shell {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 8px;
  background: #050505;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px 11px 8px;
  min-height: 64px;
  overflow: hidden;
}
.field-caption {
  position: absolute;
  top: 7px;
  left: 11px;
  color: var(--quiet);
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.input-shell input {
  min-width: 0;
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  text-align: right;
  font-size: clamp(25px, 7vw, 34px);
  line-height: 1;
  font-weight: 950;
  letter-spacing: -.055em;
}
.unit { color: var(--quiet); font-size: 13px; font-weight: 850; white-space: nowrap; padding-bottom: 3px; }
.card-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 12px 12px; }
.action {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #0b0b0b;
  color: var(--text);
  padding: 12px 10px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .05em;
  text-transform: uppercase;
  min-height: 46px;
}
.action.primary { background: var(--text); color: #050505; border-color: var(--text); }
.action.quiet { color: var(--quiet); }
.action.danger { color: var(--bad); }
.settings-panel {
  border-top: 1px solid var(--line);
  padding: 12px;
  background: #0c0c0c;
}
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.setting { display: grid; gap: 5px; color: var(--quiet); font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.setting input, .setting textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #050505;
  color: var(--text);
  padding: 11px 12px;
  outline: none;
  font-size: 15px;
  font-weight: 760;
  letter-spacing: 0;
  text-transform: none;
}
.setting textarea { min-height: 70px; resize: vertical; line-height: 1.35; }
.setting.full { margin-top: 8px; }
.setting.check { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 13px; padding: 11px 12px; background: #050505; }
.setting.check input { width: 22px; height: 22px; accent-color: var(--text); }
.rebuild-panel { border-top: 1px solid var(--line); padding: 12px 16px 16px; color: var(--muted); font-size: 12px; line-height: 1.4; display: grid; gap: 6px; }
.rebuild-title, .history-title { color: var(--quiet); font-size: 11px; font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
.mini-history { display: grid; gap: 4px; padding-top: 4px; }
.simple-body { padding: 16px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.simple-main { display: grid; gap: 4px; }
.simple-prescription { color: var(--text); font-size: 18px; font-weight: 850; }
.bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 6px; }
.big-button {
  width: 100%; border: 0; border-radius: 24px; background: var(--text); color: #050505;
  padding: 18px 12px; font-weight: 950; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
}
.big-button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.month-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 22px; background: var(--panel); padding: 16px; }
.stat-value { font-size: 38px; font-weight: 950; letter-spacing: -.08em; line-height: .9; }
.stat-label { margin-top: 6px; color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; }
.month-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.month-list, .history { margin-top: 14px; display: grid; gap: 8px; }
.history-item { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 12px; color: #cfcfc7; font-size: 13px; line-height: 1.35; }
.history-item.progressed-load, .history-item.progressed-reps { border-color: rgba(216,255,122,.22); }
.history-item.missed-held { border-color: rgba(255,143,128,.22); }
.history-why { margin-top: 4px; color: var(--muted); }
.history-time { color: var(--quiet); font-size: 11px; margin-top: 5px; }
.muted-line { color: var(--quiet); }
.dialog {
  position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: flex-end; justify-content: center; padding: 14px; z-index: 10;
}
.dialog.show { display: flex; }
.sheet { width: 100%; max-width: 760px; border: 1px solid var(--line); border-radius: 28px; background: #101010; padding: 16px; }
.sheet h2 { font-size: 32px; letter-spacing: -.07em; line-height: .9; margin: 0 0 10px; text-transform: uppercase; }
.sheet p { color: var(--muted); line-height: 1.4; margin: 0 0 12px; }
.sheet textarea { width: 100%; min-height: 220px; resize: vertical; border-radius: 16px; border: 1px solid var(--line); background: #050505; color: var(--text); padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.sheet-actions { padding: 12px 0 0; }
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + var(--safe-bottom));
  transform: translateX(-50%);
  z-index: 20;
  max-width: calc(100vw - 28px);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(18,18,18,.94);
  color: var(--text);
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 820;
  box-shadow: 0 12px 34px rgba(0,0,0,.42);
}
@media (min-width: 700px) {
  .row:not(.live-row) { grid-template-columns: minmax(120px, .7fr) minmax(0, 1fr); align-items: center; }
  .live-row { grid-template-columns: 116px minmax(0, 1fr); }
  .row-top { align-self: stretch; }
  .row-fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .card-actions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .app { padding-left: 10px; padding-right: 10px; }
  .hero { padding: 20px; }
  .card-head { padding: 15px; }
  .exercise-title { font-size: 22px; }
  .row-fields { gap: 7px; }
  .live-row { grid-template-columns: 82px minmax(0, 1fr); gap: 9px; }
  .inline-load { font-size: 16px; }
  .input-shell { padding-left: 9px; padding-right: 9px; }
  .unit { font-size: 12px; }
  .settings-grid, .month-actions { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 340px) {
  .row-fields, .bottom-grid, .month-actions, .settings-grid { grid-template-columns: 1fr; }
}

@media (max-width: 420px) {
  .month-grid.compact { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .week-tabs { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .week-tab { min-height: 48px; font-size: 15px; }
}

/* v0.2 p.6: session truth / replay */
.day-chip.missed,
.session-row-card.missed {
  border-color: rgba(255,143,128,.28);
}
.day-chip.missed .day-state,
.session-row-card.missed .session-row-side span {
  color: var(--bad);
}
.draft-panel {

function assignCalendarDate(iso, value) {

  }

  const newPlan = planForDateIso(iso, nextState);
  if (iso === activeDateIso() || iso === localIsoDate(new Date())) {

  const deloadSets = Math.max(1, Math.ceil(Number(item.sets) * 0.6));

  const work = workRows(item).slice(0, deloadSets).map((row, i) => ({ ...row, id: uid(`${item.id}-deload-${i + 1}`), weight: deloadWeight, reps: item.repMin, complete: false }));

      ${ui.updateMessage ? `<div class="notice ${ui.updateMessage.toLowerCase().includes('fail') || ui.updateMessage.toLowerCase().includes('error') ? 'warn' : 'safe'}">${escapeHtml(ui.updateMessage)}</div>` : ''}

      <section class="settings-block versions-block">
        <h3>Versions</h3>
        <div class="version-list">${releaseRows}</div>
      </section>
    </div>
  </div>`;
}

async function openGlobalSettings() {
  ui.globalSettingsOpen = true;
  ui.updateMessage = '';
  render();
  await refreshGlobalSettingsInfo();
}

async function refreshGlobalSettingsInfo() {
  try {
    const res = await fetch(`./api/app-info?t=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Could not read app info.');
    ui.globalSettingsInfo = data;
  } catch (err) {
    ui.globalSettingsInfo = { app_version: APP_VERSION, app_root: 'local static mode', versions: { root: 'versions', releases: [] } };
    ui.updateMessage = `Settings loaded without server API: ${err.message || err}`;
  }
  render();
}

async function clearBrowserAppCache() {
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
    if (navigator.serviceWorker?.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg => reg.update().catch(() => null)));
    }
  } catch {}
}

async function waitForServerVersion(targetVersion, timeoutMs = 9000) {
  const started = Date.now();
  while (Date.now() - started < timeoutMs) {
    try {
      const res = await fetch(`./api/app-info?t=${Date.now()}`, { cache: 'no-store' });
      const data = await res.json();
      if (res.ok && data.ok && (!targetVersion || data.app_version === targetVersion)) {
        return data;
      }
    } catch {}
    await new Promise(resolve => setTimeout(resolve, 350));
  }
  return null;
}

async function finishUpdateAndReload(targetVersion) {
  ui.updateMessage = 'Restarting…';
  render();
  const data = await waitForServerVersion(targetVersion);
  if (data) {
    ui.updateMessage = 'Updated. Reloading…';
    ui.globalSettingsInfo = data;
    render();
    await clearBrowserAppCache();
    window.location.replace(`${window.location.pathname}?t=${Date.now()}`);
  } else {
    ui.updateMessage = 'Update installed. Server is still restarting — refresh once in a moment.';
    render();
  }
}

async function installUpdateZip(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.zip')) {
    ui.updateMessage = 'Choose a .zip update package.';
    render();
    return;
  }
  ui.updateBusy = true;
  ui.updateMessage = `Installing ${file.name}…`;
  render();
  try {
    const res = await fetch('./api/install-update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/zip', 'X-Filename': encodeURIComponent(file.name) },
      body: file,
      cache: 'no-store'
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed.');
    const targetVersion = data.target_version || data.app_version || '';
    ui.updateBusy = false;
    ui.updateMessage = data.message || 'Update installed. Restarting…';
    render();
    await finishUpdateAndReload(targetVersion);
  } catch (err) {
    ui.updateBusy = false;
    ui.updateMessage = `Update failed: ${err.message || err}`;
    render();
  }
}

async function versionCommand(action, name) {
  if (!name) return;
  ui.updateBusy = true;
  ui.updateMessage = action === 'delete' ? `Deleting ${name}…` : `Switching to ${name}…`;
  render();
  try {
    const res = await fetch(action === 'delete' ? './api/delete-version' : './api/switch-version', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
      cache: 'no-store'
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || `${action} failed.`);
    if (action === 'delete') {
      ui.updateBusy = false;
      ui.updateMessage = data.message || 'Deleted.';
      ui.globalSettingsInfo = data;
      render();
      return;
    }
    const targetVersion = data.target_version || data.app_version || '';
    ui.updateBusy = false;
    ui.updateMessage = data.message || 'Switched. Restarting…';
    render();
    await finishUpdateAndReload(targetVersion);
  } catch (err) {
    ui.updateBusy = false;
    ui.updateMessage = `${action === 'delete' ? 'Delete' : 'Switch'} failed: ${err.message || err}`;
    render();
  }
}

function backupDialog() {
  return `<div class="dialog ${ui.backupOpen ? 'show' : ''}"><div class="sheet"><h2>BACKUP</h2><p>Copy this JSON somewhere safe. Paste saved JSON and hit Import to restore.</p><textarea id="backupText">${escapeHtml(ui.backupText)}</textarea><div class="card-actions sheet-actions"><button class="action" data-action="close-backup">CLOSE</button><button class="action" data-action="copy-backup">COPY</button><button class="action primary" data-action="import-backup">IMPORT</button></div></div></div>`;
}

function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    if (action === 'update-row') {
      el.addEventListener('change', ev => updateRow(el.dataset.exerciseId, el.dataset.rowId, el.dataset.field, ev.target.value));
      el.addEventListener('blur', ev => updateRow(el.dataset.exerciseId, el.dataset.rowId, el.dataset.field, ev.target.value));
      return;
    }
    if (action === 'update-setting') {
      const eventName = el.type === 'checkbox' ? 'change' : 'change';
      el.addEventListener(eventName, ev => {
        const ex = findExercise(el.dataset.exerciseId) || findAnyExercise(el.dataset.exerciseId);
        if (ex?.type === 'lift') updateLiftSetting(el.dataset.exerciseId, el.dataset.field, el.type === 'checkbox' ? ev.target.checked : ev.target.value);
        else updateSimpleSetting(el.dataset.exerciseId, el.dataset.field, ev.target.value);
      });
      return;
    }
    if (action === 'update-rep-range') {
      el.addEventListener('change', ev => updateRepRange(el.dataset.exerciseId, ev.target.value));
      el.addEventListener('blur', ev => updateRepRange(el.dataset.exerciseId, ev.target.value));
      return;
    }
    if (action === 'update-global-deload') {
      el.addEventListener('change', ev => updateGlobalDeload(ev.target.value));
      el.addEventListener('blur', ev => updateGlobalDeload(ev.target.value));
      return;
    }
    if (action === 'update-block-setting') {
      el.addEventListener('change', ev => updateBlockSetting(el.dataset.field, ev.target.value));
      return;
    }
    if (action === 'assign-calendar-date') {
      el.addEventListener('change', ev => assignCalendarDate(el.dataset.date, ev.target.value));
      return;
    }
    if (action === 'update-session-note') {
      el.addEventListener('input', ev => { ui.noteDraft = ev.target.value; });
      el.addEventListener('blur', ev => saveSessionNote(ev.target.value));
      el.addEventListener('keydown', ev => {
        if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); saveSessionNote(ev.target.value); }
      });
      return;
    }
    if (action === 'update-exercise-note') {
      el.addEventListener('input', ev => { ui.exerciseNoteDraft = ev.target.value; });
      el.addEventListener('blur', ev => saveExerciseNote(el.dataset.exerciseId, ev.target.value));
      el.addEventListener('keydown', ev => {
        if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); saveExerciseNote(el.dataset.exerciseId, ev.target.value); }
      });
      return;
    }
    if (action === 'install-update-zip') {
      const drop = el.closest('.update-drop');
      el.addEventListener('change', ev => installUpdateZip(ev.target.files && ev.target.files[0]));
      if (drop) {
        drop.addEventListener('dragenter', ev => { ev.preventDefault(); ui.updateDrag = true; drop.classList.add('dragging'); });
        drop.addEventListener('dragover', ev => { ev.preventDefault(); });
        drop.addEventListener('dragleave', ev => { ev.preventDefault(); ui.updateDrag = false; drop.classList.remove('dragging'); });
        drop.addEventListener('drop', ev => {
          ev.preventDefault();
          ui.updateDrag = false;
          drop.classList.remove('dragging');
          const file = ev.dataTransfer?.files && ev.dataTransfer.files[0];
          installUpdateZip(file);
        });
      }
      return;
    }
    if (action === 'calendar-date') {
      let longTimer = null;
      let startX = 0;
      let startY = 0;
      const cancelLong = () => { if (longTimer) clearTimeout(longTimer); longTimer = null; };
      el.addEventListener('pointerdown', ev => {
        startX = ev.clientX; startY = ev.clientY; el.dataset.longPress = '';
        longTimer = setTimeout(() => { el.dataset.longPress = '1'; showCalendarMenu(el.dataset.date); }, 470);
      });
      el.addEventListener('pointermove', ev => { if (Math.abs(ev.clientX - startX) > 10 || Math.abs(ev.clientY - startY) > 10) cancelLong(); });
      el.addEventListener('pointerup', cancelLong);
      el.addEventListener('pointercancel', cancelLong);
      el.addEventListener('click', ev => { ev.preventDefault(); if (el.dataset.longPress === '1') { el.dataset.longPress = ''; return; } handleAction(el); });
      return;
    }
    el.addEventListener('click', ev => { ev.preventDefault(); handleAction(el); });
  });
  bindSwipeRows();
  const noteEditor = document.querySelector('[data-role="session-note-editor"], [data-role="exercise-note-editor"]');
  if (noteEditor) {
    setTimeout(() => {
      noteEditor.focus();
      try { noteEditor.setSelectionRange(noteEditor.value.length, noteEditor.value.length); } catch {}
    }, 0);
  }
}

function bindSwipeRows() {
  const rows = Array.from(document.querySelectorAll('.swipe-row.can-delete'));
  rows.forEach(row => {
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let dragging = false;
    let horizontal = false;
    const track = row.querySelector('.swipe-track');
    if (!track) return;

    const close = () => {
      row.classList.remove('open', 'dragging');
      track.style.transform = '';
    };
    const open = () => {
      closeSwipeRows(row);
      row.classList.add('open');
      track.style.transform = 'translateX(-94px)';
    };

    row.addEventListener('pointerdown', ev => {
      if (ev.target.closest('input, textarea, button, label, .input-shell')) return;
      startX = ev.clientX;
      startY = ev.clientY;
      lastX = startX;
      dragging = true;
      horizontal = false;
      row.classList.add('dragging');
      try { row.setPointerCapture(ev.pointerId); } catch {}
    });

    row.addEventListener('pointermove', ev => {
      if (!dragging) return;
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      lastX = ev.clientX;
      if (!horizontal && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.25) horizontal = true;
      if (!horizontal) return;
      ev.preventDefault();
      closeSwipeRows(row);
      const base = row.classList.contains('open') ? -94 : 0;
      const offset = Math.min(0, Math.max(-110, base + dx));
      track.style.transform = `translateX(${offset}px)`;
    });

    const finish = () => {
      if (!dragging) return;
      const dx = lastX - startX;
      dragging = false;
      row.classList.remove('dragging');
      if (!horizontal) return;
      if (dx < -46) open(); else close();
    };
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
  });

  document.addEventListener('click', ev => {
    if (!ev.target.closest('.swipe-row')) closeSwipeRows();
  }, { once: true });
}

function closeSwipeRows(except = null) {
  document.querySelectorAll('.swipe-row.open, .swipe-row.dragging').forEach(row => {
    if (row === except) return;
    row.classList.remove('open', 'dragging');
    const track = row.querySelector('.swipe-track');
    if (track) track.style.transform = '';
  });
}

function showCalendarMenu(iso) {
  ui.selectedDate = iso;
  ui.calendarMenuDate = iso;
  ui.calendarChangeDate = null;
  if (navigator.vibrate) navigator.vibrate(8);
  render();
}
function handleAction(el) {
  const action = el.dataset.action;
  if (action === 'workout') { ui.weekStripTargetDate = activeDateIso(); ui.screen = 'workout'; ui.forceWorkout = false; ui.replaySessionId = null; ui.activeDate = null; render(); }
  if (action === 'toggle-screen') { ui.replaySessionId = null; ui.screen = ui.screen === 'month' ? 'workout' : 'month'; if (ui.screen === 'workout') ui.weekStripTargetDate = activeDateIso(); if (ui.screen === 'month') { ui.monthWeek = state.currentWeekIndex || 1; ui.selectedDate = activeDateIso(); ui.calendarMonth = selectedDateIso().slice(0,7); } render(); }
  if (action === 'toggle-rebuild') { commit({ ...state, rebuildMode: !state.rebuildMode }); }
  if (action === 'edit-session-note') { startSessionNoteEdit(); }
  if (action === 'edit-exercise-note') { startExerciseNoteEdit(el.dataset.exerciseId); }
  if (action === 'goto-session') { ui.settingsExerciseId = null; ui.replaySessionId = null; ui.forceWorkout = true; ui.screen = 'workout'; ui.weekStripTargetDate = activeDateIso(); commit({ ...state, currentSessionIndex: Number(el.dataset.index), manualWorkout: null }); }
  if (action === 'open-replay') { const ev = (state.history || []).find(h => h.id === el.dataset.eventId && h.scope === 'session'); if (ev?.sessionDate) openDate(ev.sessionDate); else { ui.screen = 'workout'; render(); } }
  if (action === 'add-buildup') addBuildupRow(el.dataset.exerciseId);
  if (action === 'add-work-set') addWorkSetRow(el.dataset.exerciseId);
  if (action === 'delete-row') { closeSwipeRows(); deleteRow(el.dataset.exerciseId, el.dataset.rowId); }
  if (action === 'toggle-settings') { ui.settingsExerciseId = ui.settingsExerciseId === el.dataset.exerciseId ? null : el.dataset.exerciseId; render(); }
  if (action === 'complete-lift') completeLift(el.dataset.exerciseId);
  if (action === 'complete-simple') completeSimple(el.dataset.exerciseId);
  if (action === 'next-workout') nextWorkout();
  if (action === 'open-next-scheduled') { const next = nextScheduledWorkout(); ui.forceWorkout = true; ui.weekStripTargetDate = activeDateIso(); commit({ ...state, currentSessionIndex: next.sessionIndex }, `opened ${next.title}`); }
  if (action === 'goto-rest') { ui.replaySessionId = null; ui.forceWorkout = false; ui.screen = 'workout'; render(); }
  if (action === 'clear-session') clearCurrentSession();
  if (action === 'select-week') { ui.monthWeek = Number(el.dataset.week); render(); }
  if (action === 'toggle-block-settings') { ui.blockSettingsOpen = !ui.blockSettingsOpen; render(); }
  if (action === 'open-date') openDate(el.dataset.date);
  if (action === 'shift-week') shiftWeek(Number(el.dataset.days || 0));
  if (action === 'goto-current-week') gotoCurrentWeek();
  if (action === 'calendar-date') { ui.calendarMenuDate = null; ui.calendarChangeDate = null; openDate(el.dataset.date); }
  if (action === 'calendar-prev') shiftCalendarMonth(-1);
  if (action === 'calendar-next') shiftCalendarMonth(1);
  if (action === 'calendar-done') markDateDone(el.dataset.date);
  if (action === 'calendar-skip') toggleDateSkip(el.dataset.date);
  if (action === 'calendar-change-menu') { ui.calendarMenuDate = el.dataset.date; ui.calendarChangeDate = ui.calendarChangeDate === el.dataset.date ? null : el.dataset.date; render(); }
  if (action === 'calendar-change-to') changeCalendarDateTo(el.dataset.date, el.dataset.value);
  if (action === 'build-next-month') buildNextMonth();
  if (action === 'open-backup') openBackup('export');
  if (action === 'import-backup-open') openBackup('import');
  if (action === 'copy-backup') copyBackup();
  if (action === 'close-backup') { ui.backupOpen = false; render(); }
  if (action === 'import-backup') importBackup();
  if (action === 'open-global-settings') openGlobalSettings();
  if (action === 'close-global-settings') { ui.globalSettingsOpen = false; render(); }
  if (action === 'switch-version') versionCommand('switch', el.dataset.name);
  if (action === 'delete-version') versionCommand('delete', el.dataset.name);
  if (action === 'reset') resetProgram();
}

// Recovery build: no service-worker registration.
function renderCrash(error) {
  const node = document.getElementById('app');
  const message = escapeHtml(error && (error.stack || error.message) ? (error.stack || error.message) : String(error || 'Unknown error'));
  if (node) node.innerHTML = `<div class="app"><main class="main"><section class="hero"><h1 class="title">APP ERROR</h1><p class="note">${message}</p></section></main></div>`;
  console.error(error);
}
try { render(); } catch (error) { renderCrash(error); }
window.addEventListener('error', event => renderCrash(event.error || event.message));
window.addEventListener('unhandledrejection', event => renderCrash(event.reason || event));

  </script>
